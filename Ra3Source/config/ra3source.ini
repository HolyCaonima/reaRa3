; Ra3Source configuration.
;
; The game installation is read-only: nothing below [Game] Root is ever written.
; Root may be absolute or relative to this file. DataDir and SkuDef are relative to Root.
;
; Per-machine overrides go in ra3source.local.ini next to this file (ignored by git).
; The environment variable RA3_GAME_ROOT overrides Root; RA3_CONFIG selects another file.

[Game]
Root = D:\Game\Ra3\Game
DataDir = Data
SkuDef = ra3_english_1.0.SkuDef
